<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Next Bus</title>
  <meta name="theme-color" content="#1f6f5c">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <style>
    :root {
      --bg: #f6f5f1; --card: #ffffff; --ink: #1d1d1b; --muted: #6b6a65;
      --line: #e3e1da; --accent: #1f6f5c; --accent-ink: #ffffff;
      --soon: #b5541c; --chip: #ecebe5;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #141413; --card: #1e1e1c; --ink: #ecebe6; --muted: #9b9a94;
        --line: #2e2e2b; --accent: #4fb39a; --accent-ink: #0d1f1a;
        --soon: #f0985f; --chip: #2a2a27;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom));
    }
    main { max-width: 520px; margin: 0 auto; }
    h1 { font-size: 1.35rem; margin: 18px 0 12px; }
    .seg { display: flex; background: var(--chip); border-radius: 12px; padding: 4px; gap: 4px; }
    .seg button {
      flex: 1; border: 0; background: transparent; color: var(--ink);
      padding: 10px 6px; border-radius: 9px; font: inherit; font-weight: 600;
    }
    .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
    .opts { display: grid; gap: 10px; margin: 12px 0 16px; }
    .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .row > span { color: var(--muted); font-size: .85rem; min-width: 72px; }
    .chip {
      border: 1px solid var(--line); background: var(--card); color: var(--ink);
      border-radius: 999px; padding: 6px 12px; font: inherit; font-size: .9rem;
    }
    .chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
    select, input[type=number] {
      font: inherit; font-size: .9rem; padding: 5px 8px; border-radius: 8px;
      border: 1px solid var(--line); background: var(--card); color: var(--ink);
    }
    input[type=number] { width: 4.5em; }
    .next {
      background: var(--card); border: 1px solid var(--line); border-radius: 16px;
      padding: 16px; margin-bottom: 14px;
    }
    .next .big { font-size: 2.6rem; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .next .in { color: var(--soon); font-weight: 600; }
    .list { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
    .trip {
      display: grid; grid-template-columns: 4.2em 1fr auto; gap: 4px 10px;
      padding: 11px 14px; border-top: 1px solid var(--line); align-items: baseline;
    }
    .trip:first-child { border-top: 0; }
    .trip.past { opacity: .45; }
    .t { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 1.05rem; }
    .arr { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
    .tag { font-size: .75rem; background: var(--chip); border-radius: 6px; padding: 1px 6px; margin-right: 4px; white-space: nowrap; }
    .tag.x { background: var(--soon); color: var(--card); font-weight: 600; }
    .next .alt { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); color: var(--muted); }
    .via { grid-column: 2 / 4; color: var(--muted); font-size: .8rem; }
    .note { color: var(--muted); font-size: .8rem; margin: 12px 2px; }
    .empty { padding: 18px 14px; color: var(--muted); }
    button.link { background: none; border: 0; color: var(--accent); font: inherit; padding: 10px 14px; width: 100%; text-align: left; }
  </style>
</head>
<body>
<main>
  <h1>Next Bus <span id="sub" style="color:var(--muted);font-weight:400;font-size:.9rem"></span></h1>

  <div class="seg" id="mode">
    <button data-v="work">To work</button>
    <button data-v="home">Home</button>
  </div>

  <div class="opts">
    <div class="row"><span>Route</span><div id="corr" class="row"></div>
      <button class="chip" id="express">Express only</button></div>
    <div class="row"><span id="stopLabel">Get off</span>
      <div id="stop" class="row">
        <button class="chip" data-v="MOWBRAY">Mowbray</button>
        <button class="chip" data-v="CAPE TOWN">Cape Town</button>
      </div>
    </div>
    <div class="row"><span>Day</span>
      <select id="day">
        <option value="0">Today</option>
        <option value="1">Mon–Thu</option>
        <option value="5">Friday</option>
        <option value="6">Saturday</option>
        <option value="7">Sunday / holiday?</option>
      </select>
      <label class="row" style="gap:6px;color:var(--muted);font-size:.85rem">
        My stop is <input id="offset" type="number" min="0" max="60" inputmode="numeric"> min from terminus
      </label>
    </div>
  </div>

  <section id="next"></section>
  <section class="list" id="list"></section>
  <p class="note" id="foot"></p>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
